apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-next
  namespace: portfolio-next
spec:
  selector:
    matchLabels:
      homelab.env: dev
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-next
  namespace: portfolio-next
spec:
  selector:
    homelab.env: dev
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-traefik
  namespace: portfolio-next
spec:
  podSelector:
    matchLabels:
      homelab.env: dev
