apiVersion: apps/v1
kind: Deployment
metadata:
  name: comparebuilding-web
  namespace: comparebuilding-web
  labels:
    app.kubernetes.io/name: comparebuilding-web
    app.kubernetes.io/instance: comparebuilding-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: comparebuilding-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: comparebuilding-web
    spec:
      serviceAccountName: comparebuilding-web
      containers:
        - name: app
          image: ghcr.io/wlodzimierrr/compare_frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: APP_ENV
              value: base
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
