apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-database-egress
  namespace: ufc-dashboard
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ufc-dashboard
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homelab-database
      ports:
        - protocol: TCP
          port: 5432
