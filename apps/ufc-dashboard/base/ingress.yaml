apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ufc-dashboard
  namespace: ufc-dashboard
  labels:
    app.kubernetes.io/name: ufc-dashboard
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: ufc-dashboard.dev.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ufc-dashboard
                port:
                  number: 80
