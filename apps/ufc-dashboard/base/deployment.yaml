apiVersion: apps/v1
kind: Deployment
metadata:
  name: ufc-dashboard
  namespace: ufc-dashboard
  labels:
    app.kubernetes.io/name: ufc-dashboard
    app.kubernetes.io/instance: ufc-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ufc-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ufc-dashboard
    spec:
      serviceAccountName: ufc-dashboard
      containers:
        - name: app
          image: ghcr.io/wlodzimierrr/ufc-dashboard:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: APP_ENV
              value: base
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
