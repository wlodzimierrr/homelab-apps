apiVersion: apps/v1
kind: Deployment
metadata:
  name: ufc-dashboard
  namespace: ufc-dashboard
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: app
          image: ghcr.io/wlodzimierrr/ufc-dashboard:sha-706dd594173623a155f99438b7a0bdb2f253a2cb
          imagePullPolicy: Always
          env:
            - name: APP_ENV
              value: dev
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ufc-dashboard-database
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
