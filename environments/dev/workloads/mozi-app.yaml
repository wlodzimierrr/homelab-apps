apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mozi-dev
  namespace: argocd
spec:
  project: mozi
  source:
    repoURL: https://github.com/wlodzimierrr/homelab-workloads.git
    targetRevision: main
    path: apps/mozi/envs/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: mozi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
